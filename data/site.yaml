site:
  title: 仙童数学
  owner: 仙童数学 · sintanmath
  tagline: 把抽象的数学，变成可以看见、操作和传播的内容
  description: >-
    仙童数学（sintanmath）的个人数学主页，集中整理数学科普内容、
    交互数学项目与数学功法。
  footer: 本站内容由结构化数据生成，并持续维护。

profile:
  heading: 个人介绍
  body:
    - >-
      我是仙童数学，英文名 sintanmath，一名持续创作数学科普内容的博主。
      我希望把抽象概念转化为更直观、更有趣，也更容易参与的数学内容。
    - >-
      公开内容涵盖幼儿园到博士的一切数学主题。这个主页用于长期整理视频相关的交互实验、
      专题讲义。
  links:
    - label: 仙童数学 · B站主页
      url: https://space.bilibili.com/490068376
    - label: GitHub 主页源码
      url: https://github.com/sintanmath/sintanmath.github.io
    - label: 永远的神 · Terence Tao
      url: https://teorth.github.io/tao-web/index.html

sections:
  - id: interactive
    title: 交互数学内容
    eyebrow: Interactive mathematics
    description: >-
      可在浏览器中直接操作的数学实验、游戏与可视化工具。
      每个项目都是相互独立的网页应用。
    kind: interactive
    items:
      - id: geometric-discovery-workbench
        title: 点 · 线 · 结构
        description: 从正多面体到球杆连接，再到多方向节点系统的交互式三维几何实验台。
        status: available
        url: apps/geometric-discovery-workbench/
        video:
          status: planned
          label: B站视频
      - id: zometool-builder
        title: Zometool 虚拟构建
        description: 可在浏览器中用虚拟球杆搭建结构的 Zometool 交互构建器。
        status: available
        url: apps/zometool-builder/
        video:
          status: planned
          label: B站视频
      - id: infinite-sum-game
        title: 无穷求和游戏
        description: 一个关于无穷级数、部分和与收敛直觉的交互式数学项目。
        status: building
        url: apps/infinite-sum-game.html
        video:
          status: planned
          label: B站视频
      - id: eml-function
        title: eml函数
        description: 从常数 1 出发，用 eml(x, y) = e^x − ln y 构造新常数的交互工具。
        status: available
        url: apps/eml-function/
        video:
          status: available
          label: B站视频
          url: https://www.bilibili.com/video/BV1ZhdSB6E7E
      - id: cuspidal-cubic-addition
        title: 三次曲线加法
        description: 在 y² = x³ 等曲线上，用弦切法交互演示两点相加。
        status: available
        url: apps/cuspidal-cubic-addition/
        video:
          status: planned
          label: B站视频

