<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="嵌入第三方 vZome Lite：Zometool 虚拟构建工具。本工具并非仙童数学制作。">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Zometool 虚拟构建 — 仙童数学</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sintanmath-theme") || "system";
        if (t !== "light" && t !== "dark") t = "system";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "system";
      }
    })();
  </script>
  <style>
    :root, html[data-theme="light"] {
      color-scheme: light;
      --paper: #eef3f3;
      --ink: #1b2c2a;
      --muted: #5c706d;
      --line: #c5d4d3;
      --accent: #2f7a6c;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --paper: #121918;
      --ink: #dce7e4;
      --muted: #9aada8;
      --line: #2c3c39;
      --accent: #7ec9b6;
    }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        color-scheme: dark;
        --paper: #121918;
        --ink: #dce7e4;
        --muted: #9aada8;
        --line: #2c3c39;
        --accent: #7ec9b6;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: .85rem 1.1rem;
      min-height: 3rem;
      padding: .45rem 1rem;
      border-bottom: 1px solid var(--line);
      font-size: .88rem;
    }
    .bar a { color: var(--accent); text-underline-offset: .18em; }
    .title { font-weight: 600; }
    .note { color: var(--muted); }
    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 3rem);
      border: 0;
      background: #111;
    }
    @media (max-width: 720px) {
      .bar { flex-wrap: wrap; gap: .35rem .8rem; }
      iframe { height: calc(100% - 4.6rem); }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a href="/">← 返回仙童数学主页</a>
    <span class="title">Zometool 虚拟构建</span>
    <span class="note">嵌入第三方 <a href="https://cdn.mathufo.com/zometool/builder/" target="_blank" rel="noopener noreferrer">vZome Lite</a>，并非仙童数学制作。</span>
  </header>
  <iframe
    title="vZome Lite Zometool 构建器"
    src="https://cdn.mathufo.com/zometool/builder/"
    allow="fullscreen; accelerometer; gyroscope; xr-spatial-tracking; pointer-lock"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</body>
</html>
